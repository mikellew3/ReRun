# One-off: checks the SharpAPI and The Odds API keys and prints response shapes (never the keys).
# Run from the Actions tab ("API probe" -> Run workflow).
name: API probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe endpoints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python probe_sharpapi.py
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      - run: echo skip odds api
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
