# Builds the current slate's snapshot (fresh nflverse data, fits, injuries, weather forecasts)
# and commits it to web/public/snapshots on main, which redeploys the site on Vercel.
# CLAUDE.md §11: twice daily (morning and evening Eastern). Market lines and their movement
# come from the line history the Lines workflow keeps in the Actions cache, topped up with a
# fresh DraftKings/FanDuel pull here (free tier, no Odds API credits). The cache is per
# branch, so without that pull a run that can't see the history would publish no lines.
# Each run also records the forward test (jobs/recordForward.ts) and grades it
# (pipeline/grade_forward.py), committed with the snapshot so it costs no extra deploy.
name: Publish snapshot

on:
  schedule:
    - cron: '43 11 * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: Week (blank = current)
        required: false

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: Fetch nflverse data
        run: python fetch_nflverse.py
      - name: Restore line history
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/lines/history.json
          key: lines-history-${{ github.run_id }}
          restore-keys: lines-history-
      - name: Pull current lines
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python fetch_lines.py
      - name: Save line history
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/lines/history.json
          key: lines-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build snapshot with forecasts and lines
        run: python publish_web.py ${WEEK:+--week "$WEEK"}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install engine
        working-directory: .
        run: npm ci
      - name: Forward test - record the sim's chances on upcoming games, grade finished ones
        run: |
          id=$(python -c "import json; print(json.load(open('../web/public/snapshots/latest.json'))['id'])")
          (cd .. && npx tsx jobs/recordForward.ts "web/public/snapshots/$id.json" --dir forward-test)
          python grade_forward.py
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ../web/public/snapshots ../forward-test ../docs/forward-test.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          id=$(python -c "import json; print(json.load(open('../web/public/snapshots/latest.json'))['id'])")
          git commit -m "Publish snapshot $id"
          git pull --rebase origin main
          git push origin HEAD:main
