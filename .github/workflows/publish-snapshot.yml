# Builds the current slate's snapshot (fresh nflverse data, fits, injuries, weather forecasts)
# and commits it to web/public/snapshots on main, which redeploys the site on Vercel.
# CLAUDE.md §11: twice daily (morning and evening Eastern). Odds join in step 6.
name: Publish snapshot

on:
  schedule:
    - cron: '43 11 * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: Week (blank = current)
        required: false

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: Fetch nflverse data
        run: python fetch_nflverse.py
      - name: Build snapshot with forecasts
        run: python publish_web.py ${WEEK:+--week "$WEEK"}
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ../web/public/snapshots
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          id=$(python -c "import json; print(json.load(open('../web/public/snapshots/latest.json'))['id'])")
          git commit -m "Publish snapshot $id"
          git pull --rebase origin main
          git push origin HEAD:main
