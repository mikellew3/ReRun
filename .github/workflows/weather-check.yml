# Manual check that live forecasts work: prints game-time weather for one week's games.
# Run it from the Actions tab ("Weather check" -> Run workflow).
name: Weather check

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        default: '2026'
      week:
        description: Week
        required: true

jobs:
  forecast:
    name: Forecast one week
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      SEASON: ${{ inputs.season }}
      WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - run: python fetch_nflverse.py --seasons "$SEASON" --datasets schedules
      - run: python fetch_weather.py --season "$SEASON" --week "$WEEK"
